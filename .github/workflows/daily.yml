name: daily-report
on:
  schedule:
    - cron: "37 21 * * *"
    - cron: "7 22 * * *"
    - cron: "37 22 * * *"
    - cron: "17 23 * * *"
    - cron: "47 23 * * *"
    - cron: "27 0 * * *"
    - cron: "42 21 * * 5"
    - cron: "12 22 * * 5"
    - cron: "42 22 * * 5"
    - cron: "22 23 * * 5"
    - cron: "32 0 * * 6"
    - cron: "13 20 * * *"
    - cron: "43 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily / weekly / reminder"
        default: "daily"
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.47.0 --no-save
      - run: npx playwright install --with-deps chromium
      - run: node report.mjs
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
