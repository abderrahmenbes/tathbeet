<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج تثبيت القرآن</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1f2a24;--mu:#6b756e;--pr:#1f6f54;--pr2:#e3f1ea;--bd:#dcd8cc;--bad:#b3402f;--ok:#1f6f54}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1e2622;--tx:#eaf0ec;--mu:#9aa8a0;--pr:#58c49b;--pr2:#22352d;--bd:#33403a;--bad:#e8826f;--ok:#58c49b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px;text-align:center}.sub{text-align:center;color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%}
button.g{background:var(--pr2);color:var(--pr)}button.s{width:auto;padding:8px 12px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.sug button{width:auto;padding:6px 12px;background:var(--pr2);color:var(--pr)}
.it{border-top:1px solid var(--bd);padding:12px 0}.it:first-child{border-top:0}
.t{font-weight:700}.v{color:var(--mu);font-size:14px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.row button{width:auto;min-width:44px;padding:8px 12px;background:var(--pr2);color:var(--pr)}
.row button.on{background:var(--pr);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{background:var(--pr2);color:var(--pr)}.tabs button.on{background:var(--pr);color:#fff}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}.bar{height:8px;background:var(--pr2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.msg{text-align:center;color:var(--mu);padding:20px}.lk{text-align:center;margin-top:18px}.lk a{color:var(--mu);font-size:12px;text-decoration:underline;cursor:pointer}
</style></head><body><div class="w">
<h1>🌙 برنامج تثبيت القرآن الكريم</h1><div class="sub" id="today"></div>
<div id="app"><div class="msg">جارٍ التحميل…</div></div></div>
<script>
const SB_URL="https://syuawkhtnikqoqsjdese.supabase.co",SB_KEY="sb_publishable_XENRfQEvxfWgNcGzd6unPA_JaXNOACt";
const sb=supabase.createClient(SB_URL,SB_KEY);
const SCHED=[
{d:"السبت",t:"الحزب 1",q:null,k:"سورة يس (3 مرات)",l:"من سورة الفاتحة إلى سورة آل عمران الآية 91"},
{d:"الأحد",t:"الحزب 2",q:"الحزب 1",k:"سورة يس (3 مرات)",l:"من الآية 92 إلى الآية 81 من سورة المائدة"},
{d:"الاثنين",t:"الحزب 3",q:"الحزب 2",k:"سورة يس (3 مرات)",l:"من الآية 82 إلى الآية 40 من سورة الأنفال"},
{d:"الثلاثاء",t:"الحزب 4",q:"الحزب 3",k:"سورة يس (3 مرات)",l:"من الآية 41 إلى الآية 52 من سورة يوسف"},
{d:"الأربعاء",t:"الحزب 5",q:"الحزب 4",k:"سورة يس (3 مرات)",l:"من الآية 53 إلى نهاية سورة الكهف"},
{d:"الخميس",t:"الحزب 6",q:"الحزب 5",k:"سورة يس (3 مرات)",l:"من بداية سورة مريم إلى نهاية سورة النور"},
{d:"الجمعة",t:"تسميع مقرر الأسبوع",q:"الحزب 6",k:"سورة يس (3 مرات)",l:null}];
const dayIdx=d=>(d.getDay()+1)%7;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const norm=s=>(s||"").trim().replace(/\s+/g," ");
function items(i){const s=SCHED[i],a=[];
 a.push(["t","ورد التثبيت",s.t,i===6?0:7]);
 if(s.q)a.push(["q","مراجعة القريب",s.q,0]);
 if(s.l)a.push(["l","ورد التلاوة",s.l,0]);
 a.push(["k","ورد التخصيص",s.k,3]);return a}
const isDone=(it,r)=>{const x=r&&r[it[0]];if(x==null)return false;return it[3]?x>=it[3]:x===1};
const $=id=>document.getElementById(id),app=$("app");
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
const today=new Date();$("today").textContent=SCHED[dayIdx(today)].d+" — "+today.toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric"});
let me=localStorage.getItem("tn_me")||"",names=[],page="student",draft={},editing=false,ex={},busy=false;
let reports=[],students=[],period="day",authed=false,loginErr="";
const known=()=>{try{return JSON.parse(localStorage.getItem("tn_names")||"[]")}catch(e){return[]}};
async function init(){
 try{const {data}=await sb.from("students").select("name");names=(data||[]).map(x=>x.name)}catch(e){}
 try{const {data}=await sb.auth.getSession();if(data&&data.session){authed=true}}catch(e){}
 render()}
function render(){
 const act=document.activeElement&&document.activeElement.id;
 let h="";
 if(page==="student")h=studentView();else if(page==="login")h=loginView();else h=adminView();
 app.innerHTML=h;
 if(act&&$(act)&&$(act).tagName==="INPUT"){const e=$(act);e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
function studentView(){
 const foot=`<div class="lk"><a onclick="goAdmin()">دخول المشرف</a></div>`;
 if(!me){const v=norm(($("nm")&&$("nm").value)||"");
  const all=[...new Set([...known(),...names])];
  const m=v?all.filter(n=>n.startsWith(v)&&n!==v).slice(0,6):[];
  return `<div class="card"><div class="t">السلام عليكم ورحمة الله</div><div class="v" style="margin-bottom:10px">اكتب اسمك للدخول</div>
  <input id="nm" value="${esc(v)}" placeholder="الاسم" oninput="render()" autocomplete="off">
  <div class="sug">${m.map(n=>`<button data-n="${esc(n)}" onclick="login(this.dataset.n)">${esc(n)}</button>`).join("")}</div>
  <button onclick="login($('nm').value)">دخول</button></div>${foot}`}
 const i=dayIdx(today),ds=iso(today),id=ds+"_"+me;
 if(localStorage.getItem("tn_s_"+id)&&!editing)return successView()+foot;
 if(draft.id!==id){let o={};try{o=JSON.parse(localStorage.getItem("tn_d_"+id)||"{}")}catch(e){}draft={id,v:o}}
 let h=`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="v">الطالب</div><div class="t">${esc(me)}</div></div><button class="s g" onclick="logout()">تغيير</button></div><div class="card">`;
 items(i).forEach(it=>{const [k,l,v,mx]=it,cur=draft.v[k];
  h+=`<div class="it"><div class="t">${l}</div><div class="v">${esc(v)}</div><div class="v" style="margin-top:6px">${mx?"هل أتممته غيبًا؟":"هل قرأته؟"}</div><div class="row">`;
  if(mx){const oth=(cur>0&&cur<mx)||ex[k];
   h+=`<button class="${cur===mx?"on":""}" onclick="setv('${k}',${mx})">نعم ${mx} مرات ✔</button><button class="${cur===0?"on":""}" onclick="setv('${k}',0)">لا</button><button class="${oth&&cur!==0&&cur!==mx?"on":""}" onclick="more('${k}')">عدد آخر</button>`;
   if(oth){h+=`</div><div class="row">`;for(let n=1;n<mx;n++)h+=`<button class="${cur===n?"on":""}" onclick="setv('${k}',${n})">${n}</button>`}}
  else h+=`<button class="${cur===1?"on":""}" onclick="setv('${k}',1)">نعم</button><button class="${cur===0?"on":""}" onclick="setv('${k}',0)">لا</button>`;
  h+=`</div></div>`});
 const late=today.getHours()>=22&&iso(new Date())===ds&&new Date().getHours()>=22;
 h+=`</div>${late?'<div class="card bad">تنبيه: تجاوزت الساعة 10 مساءً (موعد إرسال التقرير)</div>':''}<button onclick="save()" ${busy?"disabled":""}>${busy?"جارٍ الإرسال…":"إرسال التقرير"}</button>${foot}`;
 return h}
function successView(){return `<div class="card" style="text-align:center;padding:32px 16px"><div style="font-size:56px">✅</div><div class="t" style="font-size:20px;margin:8px 0">تم إرسال تقريرك بنجاح</div><div class="v" style="margin-bottom:6px">${esc(me)}</div><div class="v" style="margin-bottom:18px">بارك الله فيك وجعله في ميزان حسناتك 🌙</div><button class="g" onclick="editing=true;render()">↩ الرجوع وتعديل التقرير</button></div>`}
function setv(k,n){draft.v[k]=n;const mx=items(dayIdx(today)).find(i=>i[0]===k)[3];if(n===0||n===mx)delete ex[k];render()}
function more(k){ex[k]=1;render()}
function login(n){n=norm(n);if(n.length<2){alert("اكتب اسمك");return}me=n;localStorage.setItem("tn_me",n);const a=known();if(!a.includes(n)){a.push(n);localStorage.setItem("tn_names",JSON.stringify(a))}editing=false;render()}
function logout(){me="";localStorage.removeItem("tn_me");draft={};editing=false;render()}
async function save(){
 if(busy)return;
 const its=items(dayIdx(today));
 if(its.some(it=>draft.v[it[0]]==null)){alert("أجب عن جميع الخانات أولًا");return}
 busy=true;render();
 const now=new Date();
 const {error}=await sb.rpc("submit_report",{p_name:me,p_date:iso(today),p_day:dayIdx(today),p_v:draft.v,p_late:now.getHours()>=22});
 busy=false;
 if(error){alert("تعذّر الإرسال، تأكد من الاتصال وحاول مرة أخرى");render();return}
 localStorage.setItem("tn_s_"+draft.id,"1");localStorage.setItem("tn_d_"+draft.id,JSON.stringify(draft.v));editing=false;render();window.scrollTo(0,0)}
// ---- admin
function goAdmin(){page=authed?"admin":"login";if(authed)loadAdmin();render()}
function loginView(){return `<div class="card"><div class="t" style="margin-bottom:10px">دخول المشرف</div><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">${loginErr?`<div class="bad" style="margin-bottom:8px">${loginErr}</div>`:""}<button onclick="doLogin()">دخول</button><div style="margin-top:8px"><button class="g" onclick="page='student';render()">رجوع</button></div></div>`}
async function doLogin(){
 const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error){loginErr="البريد أو كلمة المرور غير صحيحة";render();return}
 loginErr="";authed=true;page="admin";await loadAdmin();render()}
async function adminOut(){await sb.auth.signOut();authed=false;page="student";reports=[];render()}
async function loadAdmin(){
 let all=[],from=0;
 while(true){const {data,error}=await sb.from("reports").select("*").range(from,from+999);if(error||!data)break;all=all.concat(data);if(data.length<1000)break;from+=1000}
 reports=all.map(r=>({name:r.name,sk:r.name,date:r.report_date,day:r.day_idx,v:r.v,late:r.late}));
 const s=await sb.from("students").select("name");students=(s.data||[]).map(x=>x.name);render()}
function range(){const t=new Date(today.getFullYear(),today.getMonth(),today.getDate());let s=new Date(t);
 if(period==="week")s.setDate(t.getDate()-dayIdx(t));else if(period==="month")s=new Date(t.getFullYear(),t.getMonth(),1);
 const a=[];for(let d=new Date(s);d<=t;d.setDate(d.getDate()+1))a.push({ds:iso(d),i:dayIdx(d)});return a}
function adminView(){
 const days=range(),set=new Set(days.map(d=>d.ds));
 const all=new Set([...students,...reports.map(r=>r.name)]);
 const rows=[...all].map(n=>{
  const rs=reports.filter(r=>r.sk===n&&set.has(r.date));
  let done=0,tot=0;rs.forEach(r=>items(r.day).forEach(it=>{tot++;if(isDone(it,r.v))done++}));
  return{n,k:n,sent:rs.length,pct:tot?Math.round(done/tot*100):0,miss:days.filter(d=>!rs.find(r=>r.date===d.ds)),late:rs.filter(r=>r.late).length}}).sort((a,b)=>a.sent-b.sent);
 const pl={day:"اليوم",week:"هذا الأسبوع",month:"هذا الشهر"};
 let h=`<div class="tabs">${["day","week","month"].map(p=>`<button class="${period===p?"on":""}" onclick="period='${p}';render()">${{day:"يومي",week:"أسبوعي",month:"شهري"}[p]}</button>`).join("")}</div>`;
 if(!rows.length)h+=`<div class="card msg">لا يوجد طلاب بعد</div>`;
 else if(period==="day"){
  const ds=iso(today),i=dayIdx(today),its=items(i);
  h+=`<div class="card"><div class="t">تقرير ${SCHED[i].d} — ${rows.filter(r=>reports.find(x=>x.date===ds&&x.sk===r.k)).length} من ${rows.length} أرسلوا</div><div class="sc"><table><tr><th>الطالب</th>${its.map(x=>`<th>${x[1]}</th>`).join("")}<th></th></tr>`;
  rows.forEach(r=>{const rep=reports.find(x=>x.date===ds&&x.sk===r.k);
   h+=`<tr><td>${esc(r.n)}</td>${its.map(it=>rep?`<td class="${isDone(it,rep.v)?"ok":"bad"}">${it[3]?(rep.v[it[0]]??0)+"/"+it[3]:(rep.v[it[0]]===1?"✔":"✘")}</td>`:'<td class="bad">—</td>').join("")}<td class="${rep?(rep.late?"bad":"ok"):"bad"}">${rep?(rep.late?"متأخر":"أرسل"):"لم يرسل"}</td></tr>`});
  h+=`</table></div></div>`}
 else{
  h+=`<div class="card"><div class="t">تقرير ${pl[period]} (${days.length} يوم)</div><div class="sc"><table><tr><th>الطالب</th><th>أيام الإرسال</th><th>الإنجاز</th><th>تأخر</th><th>أيام لم يرسل فيها</th></tr>`;
  rows.forEach(r=>{h+=`<tr><td>${esc(r.n)}</td><td>${r.sent}/${days.length}</td><td style="min-width:90px">${r.pct}%<div class="bar"><i style="width:${r.pct}%"></i></div></td><td>${r.late}</td><td class="bad" style="white-space:normal">${r.miss.map(d=>SCHED[d.i].d+" "+d.ds.slice(5)).join("، ")||"—"}</td></tr>`});
  h+=`</table></div></div>`}
 return h+`<div class="row" style="justify-content:center"><button class="s g" onclick="loadAdmin()">تحديث</button><button class="s g" onclick="page='student';render()">صفحة الطالب</button><button class="s g" onclick="adminOut()">خروج</button></div>`}
init();
</script></body></html>
