<style>

.bar{height:8px;background:var(--pr2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btn);border-radius:8px}.pg i{background:var(--gold)}

.po{display:none}.dh{font-family:"Reem Kufi",sans-serif;font-weight:700;margin:16px 0 4px;color:var(--pr)}label{font-size:13px;color:var(--mu)}

@media print{:root{--bg:#fff;--card:#fff;--tx:#10231F;--mu:#4a5d57;--pr:#0E5C4E;--btn:#0E5C4E;--pr2:#E2EEE9;--bd:#cdd9d4;--gold:#B8923A;--gold2:#F6EEDA;--bad:#A8432F;--badbg:#F8E5E0;--ok:#0E5C4E;--okbg:#DAEEE6;--warn:#85570A;--warnbg:#F8EAC6;--hd1:#08332D;--hd2:#0E5C4E;--stripe:#F3F8F6}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.noprint{display:none!important}.po{display:block;text-align:center;font-weight:700;font-size:18px;margin-bottom:10px}.card{border:0;padding:0}.card.frame{border:2px solid var(--gold);padding:12px}body{background:#fff}.w{max-width:none;padding:0}.sc{overflow:visible}.nmh,td:has(>.nm){position:static;box-shadow:none}}
</style></head><body><header class="hd noprint"><div class="bsm">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><h1>تثبيت القرآن</h1><div class="tg">استعدادًا لشهر رمضان المبارك</div><div class="sub"><span id="today"></span> &nbsp;•&nbsp; <span id="hj"></span></div></header>
<div class="w">
<div id="app"><div class="msg">جارٍ التحميل…</div></div></div>
<script>
const SB_URL="https://syuawkhtnikqoqsjdese.supabase.co",SB_KEY="sb_publishable_XENRfQEvxfWgNcGzd6unPA_JaXNOACt";
const sb=supabase.createClient(SB_URL,SB_KEY);
const DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
const DEF=[
{t:"الحزب 1",q:"",l:"من سورة الفاتحة إلى سورة آل عمران الآية 91",k:"سورة يس (3 مرات)"},
{t:"الحزب 2",q:"الحزب 1",l:"من الآية 92 إلى الآية 81 من سورة المائدة",k:"سورة يس (3 مرات)"},
{t:"الحزب 3",q:"الحزب 2",l:"من الآية 82 إلى الآية 40 من سورة الأنفال",k:"سورة يس (3 مرات)"},
{t:"الحزب 4",q:"الحزب 3",l:"من الآية 41 إلى الآية 52 من سورة يوسف",k:"سورة يس (3 مرات)"},
{t:"الحزب 5",q:"الحزب 4",l:"من الآية 53 إلى نهاية سورة الكهف",k:"سورة يس (3 مرات)"},
{t:"الحزب 6",q:"الحزب 5",l:"من بداية سورة مريم إلى نهاية سورة النور",k:"سورة يس (3 مرات)"},
{t:"تسميع مقرر الأسبوع",q:"الحزب 6",l:"",k:"سورة يس (3 مرات)"}];
let SCHED=JSON.parse(JSON.stringify(DEF)),START="2026-10-31";
const LBL={t:"ورد التثبيت",q:"مراجعة القريب",l:"ورد التلاوة",k:"ورد التخصيص"},KEYS=["t","q","l","k"];
const maxOf=(k,day)=>k==="t"?(day===6?0:7):k==="k"?3:0;
const dayIdx=d=>(d.getDay()+1)%7;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const norm=s=>(s||"").trim().replace(/\s+/g," ");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const items=i=>KEYS.filter(k=>SCHED[i][k]&&String(SCHED[i][k]).trim()).map(k=>[k,LBL[k],SCHED[i][k],maxOf(k,i)]);
const okv=(k,day,x)=>{if(x==null)return false;const m=maxOf(k,day);return m?x>=m:x===1};
const cell=(k,day,x)=>{const m=maxOf(k,day);return `<td class="${okv(k,day,x)?"ok":"bad"}"><span class="pill">${m?(x==null?0:x)+"/"+m:(x===1?"✓":"✕")}</span></td>`};
const $=id=>document.getElementById(id),app=$("app");
const today=new Date(),TD=iso(today);
$("today").textContent=DAYS[dayIdx(today)]+" — "+today.toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric"});
try{$("hj").textContent=today.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"})}catch(e){}
const fmt=ds=>new Date(ds+"T00:00:00").toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});
let me=localStorage.getItem("tn_me")||"",names=[],page="student",draft={},editing=false,ex={},busy=false;
let schedPage=false,wkStart="",reports=[],students=[],period="day",authed=false,loginErr="",detail="",viewDate=TD;
const known=()=>{try{return JSON.parse(localStorage.getItem("tn_names")||"[]")}catch(e){return[]}};
async function loadSettings(){
 try{const {data}=await sb.from("settings").select("*");(data||[]).forEach(r=>{
  if(r.key==="schedule"&&Array.isArray(r.value)&&r.value.length===7)SCHED=r.value.map((x,i)=>Object.assign({},DEF[i],x));
  if(r.key==="start"&&typeof r.value==="string")START=r.value})}catch(e){}}
async function init(){
 await loadSettings();
 try{const {data}=await sb.from("students").select("name");names=(data||[]).map(x=>x.name)}catch(e){}
 try{const {data}=await sb.auth.getSession();if(data&&data.session)authed=true}catch(e){}
 render()}
function render(){
 const act=document.activeElement&&document.activeElement.id;
 app.innerHTML=page==="student"?studentView():page==="login"?loginView():adminView();
 if(act&&$(act)&&$(act).tagName==="INPUT"&&$(act).type==="text"){const e=$(act);e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
// ---------- student
function studentView(){
 const foot=`<div class="lk"><a onclick="goAdmin()">دخول المشرف</a></div>`;
 if(!me){const v=($("nm")&&$("nm").value)||"";
  return `<div class="card"><div class="t">السلام عليكم ورحمة الله</div><div class="v" style="margin-bottom:10px">اكتب اسمك للدخول</div><div class="note">⚠ تنبيه: اكتب اسمك بنفس الطريقة في كل مرة (نفس الحروف والترتيب)، لأن تقريرك وإحصائياتك مرتبطة بالاسم.</div>
  <input id="nm" type="text" value="${esc(v)}" placeholder="الاسم" oninput="sugg()" autocomplete="off">
  <div class="sug" id="sg">${sugHtml(v)}</div>
  <button onclick="login($('nm').value)">دخول</button></div>${foot}`}
 const head=`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="v">الطالب</div><div class="t">${esc(me)}</div></div><button class="s g" onclick="logout()">تغيير</button></div>`;
 if(TD<START)return head+`<div class="card msg"><div style="font-size:42px">🌙</div><div class="t">يبدأ البرنامج بإذن الله</div><div>${fmt(START)}</div></div>`+foot;
 const i=dayIdx(today),id=TD+"_"+me;
 if(localStorage.getItem("tn_s_"+id)&&!editing)return head.replace("","")+successView()+foot;
 if(draft.id!==id){let o={};try{o=JSON.parse(localStorage.getItem("tn_d_"+id)||"{}")}catch(e){}draft={id,v:o}}
 const its=items(i),ans=its.filter(x=>draft.v[x[0]]!=null).length;let h=head+`<div class="card"><div class="v" style="margin-bottom:6px">أجبت عن ${ans} من ${its.length}</div><div class="bar pg" style="margin-bottom:8px"><i style="width:${ans/its.length*100}%"></i></div>`;
 items(i).forEach(it=>{const [k,l,v,mx]=it,cur=draft.v[k];
  h+=`<div class="it"><div class="t">${l}</div><div class="val">${esc(v)}</div><div class="v" style="margin-top:6px">${mx?"هل أتممته غيبًا؟":"هل قرأته؟"}</div><div class="row">`;
  if(mx){const oth=(cur>0&&cur<mx)||ex[k];
   h+=`<button class="${cur===mx?"on":""}" onclick="setv('${k}',${mx})">نعم ${mx} مرات ✔</button><button class="${cur===0?"on no":""}" onclick="setv('${k}',0)">لا</button><button class="${oth&&cur!==0&&cur!==mx?"on":""}" onclick="more('${k}')">عدد آخر</button>`;
   if(oth){h+=`</div><div class="row">`;for(let n=1;n<mx;n++)h+=`<button class="${cur===n?"on":""}" onclick="setv('${k}',${n})">${n}</button>`}}
  else h+=`<button class="${cur===1?"on":""}" onclick="setv('${k}',1)">نعم</button><button class="${cur===0?"on no":""}" onclick="setv('${k}',0)">لا</button>`;
  h+=`</div></div>`});
 const late=new Date().getHours()>=22;
 h+=`</div><div class="note">⚠ تنبيه: سجّل ورد <b>اليوم</b> فقط، ولا يمكن إدخال ورد يوم مضى. موعد الإرسال قبل الساعة 10 مساءً، ومن لم يسجّل يُحسب «لم يقرأ ورده».</div>${late?'<div class="card bad">تنبيه: تجاوزت الساعة 10 مساءً (موعد إرسال التقرير)</div>':''}<button onclick="save()" ${busy?"disabled":""}>${busy?"جارٍ الإرسال…":"إرسال التقرير"}</button>${foot}`;
 return h}
function sugHtml(raw){const v=norm(raw),all=[...new Set([...known(),...names])];return (v?all.filter(n=>n.startsWith(v)&&n!==v).slice(0,6):[]).map(n=>`<button data-n="${esc(n)}" onclick="login(this.dataset.n)">${esc(n)}</button>`).join("")}
function sugg(){$("sg").innerHTML=sugHtml($("nm").value)}
function successView(){return `<div class="card" style="text-align:center;padding:32px 16px"><div class="seal">✓</div><div class="t" style="font-size:20px;margin:8px 0">تم إرسال تقريرك بنجاح</div><div class="v" style="margin-bottom:6px">${esc(me)}</div><div class="v" style="margin-bottom:18px">بارك الله فيك وجعله في ميزان حسناتك 🌙</div><button class="g" onclick="editing=true;render()">↩ الرجوع وتعديل التقرير</button></div>`}
function setv(k,n){draft.v[k]=n;const mx=maxOf(k,dayIdx(today));if(n===0||n===mx)delete ex[k];render()}
function more(k){ex[k]=1;render()}
function login(n){n=norm(n);if(n.length<2){alert("اكتب اسمك");return}if(![...known(),...names].includes(n)&&!confirm("«"+n+"» اسم جديد لم يُسجَّل من قبل.\n\nهل هو اسمك الصحيح؟ تذكّر أن تستعمل نفس الاسم دائمًا."))return;me=n;localStorage.setItem("tn_me",n);const a=known();if(!a.includes(n)){a.push(n);localStorage.setItem("tn_names",JSON.stringify(a))}editing=false;render()}
function logout(){if(!confirm("تنبيه: يجب أن تستعمل نفس الاسم دائمًا. تغيير الاسم ينشئ سجلًّا جديدًا منفصلًا.\n\nهل تريد تغيير الاسم؟"))return;me="";localStorage.removeItem("tn_me");draft={};editing=false;render()}
async function save(){
 if(busy)return;
 if(iso(new Date())!==TD){alert("انتهى هذا اليوم، سيتم تحديث الصفحة لورد اليوم الجديد");location.reload();return}
 if(items(dayIdx(today)).some(it=>draft.v[it[0]]==null)){alert("أجب عن جميع الخانات أولًا");return}
 busy=true;render();
 const {error}=await sb.rpc("submit_report",{p_name:me,p_date:TD,p_day:dayIdx(today),p_v:draft.v,p_late:new Date().getHours()>=22});
 busy=false;
 if(error){alert((error.message||"").includes("old date")?"لا يمكن إدخال ورد يوم مضى":"تعذّر الإرسال، تأكد من الاتصال وحاول مرة أخرى");render();return}
 localStorage.setItem("tn_s_"+draft.id,"1");localStorage.setItem("tn_d_"+draft.id,JSON.stringify(draft.v));editing=false;render();window.scrollTo(0,0)}
// ---------- admin
function goAdmin(){page=authed?"admin":"login";if(authed)loadAdmin();render()}
function loginView(){return `<div class="card"><div class="t" style="margin-bottom:10px">دخول المشرف</div><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">${loginErr?`<div class="bad" style="margin-bottom:8px">${loginErr}</div>`:""}<button onclick="doLogin()">دخول</button><div style="margin-top:8px"><button class="g" onclick="page='student';render()">رجوع</button></div></div>`}
async function doLogin(){
 const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error){loginErr="البريد أو كلمة المرور غير صحيحة";render();return}
 loginErr="";authed=true;page="admin";await loadAdmin();render()}
async function adminOut(){await sb.auth.signOut();authed=false;page="student";reports=[];detail="";render()}
async function loadAdmin(){
 let all=[],from=0;
 while(true){const {data,error}=await sb.from("reports").select("*").range(from,from+999);if(error||!data)break;all=all.concat(data);if(data.length<1000)break;from+=1000}
 reports=all.map(r=>({name:r.name,date:r.report_date,day:r.day_idx,v:r.v,late:r.late}));
 const s=await sb.from("students").select("name");students=(s.data||[]).map(x=>x.name);render()}
function pdays(){const t=new Date(today.getFullYear(),today.getMonth(),today.getDate());let s=new Date(t);
 if(period==="week")s.setDate(t.getDate()-dayIdx(t));else if(period==="month")s=new Date(t.getFullYear(),t.getMonth(),1);
 const a=[];for(let d=new Date(s);d<=t;d.setDate(d.getDate()+1)){const ds=iso(d);if(ds>=START)a.push({ds,i:dayIdx(d)})}return a}
function stat(n,days){
 const set=new Set(days.map(d=>d.ds)),rs=reports.filter(r=>r.name===n&&set.has(r.date&&r.date)&&r.date>=START);
 let done=0,tot=0;rs.forEach(r=>Object.keys(r.v).forEach(k=>{tot++;if(okv(k,r.day,r.v[k]))done++}));
 return{n,sent:rs.length,pct:tot?Math.round(done/tot*100):0,miss:days.filter(d=>!rs.find(r=>r.date===d.ds)),late:rs.filter(r=>r.late).length}}
const nmLink=n=>`<span class="nm" data-n="${esc(n)}" onclick="detail=this.dataset.n;render();window.scrollTo(0,0)">${esc(n)}</span>`;
function adminView(){
 if(detail)return detailView();
 if(schedPage)return schedView();
 let h=`<div class="tabs noprint">${[["day","يومي"],["week","أسبوعي"],["month","شهري"],["set","إعدادات"]].map(p=>`<button class="${period===p[0]?"on":""}" onclick="period='${p[0]}';render()">${p[1]}</button>`).join("")}</div>`;
 if(period==="set")return h+settingsView();
 const all=[...new Set([...students,...reports.map(r=>r.name)])];
 const foot=`<div class="row noprint" style="justify-content:center"><button class="s g" onclick="loadAdmin()">تحديث</button><button class="s g" onclick="page='student';render()">صفحة الطالب</button><button class="s g" onclick="adminOut()">خروج</button></div>`;
 if(!all.length)return h+`<div class="card msg">لا يوجد طلاب بعد</div>`+foot;
 if(period==="day"){
  const ds=viewDate,i=dayIdx(new Date(ds+"T00:00:00"));
  h+=`<div class="noprint"><label>اختر التاريخ</label><input type="date" value="${ds}" onchange="viewDate=this.value||TD;render()"></div>`;
  if(ds<START)return h+`<div class="card msg">قبل بداية البرنامج (${fmt(START)})</div>`+foot;
  const rep=n=>reports.find(x=>x.date===ds&&x.name===n);
  const used=KEYS.filter(k=>(SCHED[i][k]&&String(SCHED[i][k]).trim())||reports.some(r=>r.date===ds&&k in r.v));
  const rows=all.map(n=>({n,r:rep(n)})).sort((a,b)=>(a.r?1:0)-(b.r?1:0)||a.n.localeCompare(b.n,"ar"));
  h+=`<div class="po">تقرير تثبيت القرآن — ${fmt(ds)}</div><div class="card"><div class="t tt">${DAYS[i]} ${ds} — ${rows.filter(x=>x.r).length} من ${rows.length} أرسلوا</div><div class="sc"><table><tr><th class="nmh">الطالب</th>${used.map(k=>`<th>${LBL[k]}</th>`).join("")}<th>الحالة</th><th class="noprint"></th></tr>`;
  rows.forEach((x,j)=>{h+=`<tr><td>${nmLink(x.n)}</td>${used.map(k=>x.r?(k in x.r.v?cell(k,i,x.r.v[k]):'<td>—</td>'):'<td class="bad">—</td>').join("")}<td class="${x.r?(x.r.late?"warn":"ok"):"bad"}"><span class="chip">${x.r?(x.r.late?"متأخر":"أرسل"):"لم يقرأ ورده"}</span></td><td class="noprint">${x.r?`<button class="s g" data-n="${esc(x.n)}" data-d="${ds}" onclick="delReport(this.dataset.n,this.dataset.d)">🗑</button>`:`<button class="s g bad" data-n="${esc(x.n)}" onclick="delStudent(this.dataset.n)">حذف الطالب</button>`}</td></tr>`});
  return h+`</table></div></div><div class="noprint" style="margin-bottom:12px"><button onclick="window.print()">📄 حفظ التقرير PDF</button></div>`+foot}
 const days=pdays(),pl={week:"هذا الأسبوع",month:"هذا الشهر"};
 if(!days.length)return h+`<div class="card msg">لم يبدأ البرنامج بعد (${fmt(START)})</div>`+foot;
 const rows=all.map(n=>stat(n,days)).sort((a,b)=>a.sent-b.sent);
 h+=`<div class="po">تقرير ${pl[period]}</div><div class="card"><div class="t tt">تقرير ${pl[period]} (${days.length} يوم)</div><div class="sc"><table><tr><th class="nmh">الطالب</th><th>أيام الإرسال</th><th>الإنجاز</th><th>تأخر</th><th>أيام لم يقرأ فيها ورده</th></tr>`;
 rows.forEach(r=>{h+=`<tr><td>${nmLink(r.n)}</td><td>${r.sent}/${days.length}</td><td style="min-width:90px">${r.pct}%<div class="bar"><i style="width:${r.pct}%"></i></div></td><td>${r.late}</td><td class="bad" style="white-space:normal">${r.miss.map(d=>DAYS[d.i]+" "+d.ds.slice(5)).join("، ")||"—"}</td></tr>`});
 return h+`</table></div></div><div class="noprint" style="margin-bottom:12px"><button onclick="window.print()">📄 حفظ التقرير PDF</button></div>`+foot}
function detailView(){
 const n=detail,all=[];for(let d=new Date(START+"T00:00:00");iso(d)<=TD;d.setDate(d.getDate()+1))all.push({ds:iso(d),i:dayIdx(d)});
 const st=stat(n,all),byd={};reports.filter(r=>r.name===n).forEach(r=>byd[r.date]=r);
 let h=`<div class="noprint"><button class="g" onclick="detail='';render()">↩ رجوع</button></div><div class="po">سجلّ الطالب: ${esc(n)}</div>
 <div class="card"><div class="t" style="font-size:18px">${esc(n)}</div>
 <div class="v">أيام الإرسال: <b>${st.sent}</b> من ${all.length} — الغياب: <b class="bad">${st.miss.length}</b> — التأخر: <b>${st.late}</b></div>
 <div style="margin-top:8px">نسبة الإنجاز: ${st.pct}%<div class="bar"><i style="width:${st.pct}%"></i></div></div></div>`;
 if(!all.length)return h+`<div class="card msg">لم يبدأ البرنامج بعد</div>`;
 h+=`<div class="card"><div class="sc"><table><tr><th>التاريخ</th>${KEYS.map(k=>`<th>${LBL[k]}</th>`).join("")}<th></th><th class="noprint"></th></tr>`;
all.slice().reverse().forEach(d=>{const r=byd[d.ds];
  if(!r){h+=`<tr><td>${DAYS[d.i]} ${d.ds.slice(5)}</td><td class="bad" colspan="6"><span class="chip">لم يقرأ ورده</span></td></tr>`;return}
  h+=`<tr><td>${DAYS[d.i]} ${d.ds.slice(5)}</td>${KEYS.map(k=>k in r.v?cell(k,d.i,r.v[k]):"<td>—</td>").join("")}<td class="${r.late?"warn":"ok"}"><span class="chip">${r.late?"متأخر":"أرسل"}</span></td><td class="noprint"><button class="s g" data-n="${esc(n)}" data-d="${d.ds}" onclick="delReport(this.dataset.n,this.dataset.d)">🗑</button></td></tr>`});
 h+=`</table></div></div><div class="noprint"><button class="g" onclick="window.print()">📄 حفظ السجل PDF</button><div style="height:8px"></div><button class="d" data-n="${esc(n)}" onclick="delStudent(this.dataset.n)">🗑 حذف هذا الطالب وتقاريره</button></div>`;
 return h}
async function delReport(n,ds){
 if(!confirm("حذف تقرير «"+n+"» ليوم "+ds+"؟"))return;
 const {error}=await sb.from("reports").delete().eq("name",n).eq("report_date",ds);
 if(error){alert("تعذّر الحذف");return}
 reports=reports.filter(r=>!(r.name===n&&r.date===ds));render()}
async function delStudent(n){
 if(!confirm("حذف الطالب «"+n+"» وكل تقاريره نهائيًا؟"))return;
 const a=await sb.from("reports").delete().eq("name",n),b=await sb.from("students").delete().eq("name",n);
 if(a.error||b.error){alert("تعذّر الحذف، تأكد من تنفيذ كود SQL الجديد");return}
 detail="";await loadAdmin()}
function settingsView(){
 let h=`<div class="card"><div class="t">تاريخ بداية البرنامج</div><div class="v" style="margin-bottom:6px">لا يُحتسب أي يوم قبله في الإحصائيات</div><input type="date" id="st" value="${START}"></div>
 <div class="card"><div class="t">جدول الأسبوع</div><div class="v">اترك الخانة فارغة إن لم يكن هناك ورد في ذلك اليوم</div>`;
 DAYS.forEach((d,i)=>{h+=`<div class="dh">${d}</div>`+KEYS.map(k=>`<label>${LBL[k]}</label><input type="text" id="sc_${i}_${k}" value="${esc(SCHED[i][k]||"")}">`).join("")});
 return h+`</div><button onclick="saveSet()">حفظ الإعدادات</button><div style="height:8px"></div><button class="g" onclick="openSched()">📄 جدول الأسبوع PDF</button><div style="height:8px"></div><button class="g" onclick="page='student';render()">صفحة الطالب</button><div class="v" style="margin-top:8px">احفظ الإعدادات أولًا ثم افتح جدول الأسبوع.</div>`}
function satOf(ds){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()-dayIdx(d));return iso(d)}
function openSched(){if(!wkStart)wkStart=satOf(TD<START?START:TD);schedPage=true;render();window.scrollTo(0,0)}
function schedView(){
 const b=new Date(wkStart+"T00:00:00");
 let h=`<div class="noprint"><button class="g" onclick="schedPage=false;render()">↩ رجوع</button><label style="display:block;margin-top:8px">اختر أي تاريخ من الأسبوع المطلوب</label><input type="date" value="${wkStart}" onchange="wkStart=satOf(this.value||wkStart);render()"></div><div class="card frame"><div class="sch-t"><span>تثبيت القرآن</span><small>أسبوع ${fmt(wkStart)}</small></div><div class="sc"><table class="sched"><tr><th>الأيام</th><th>تكرار الحزب 7 مرات</th><th>مراجعة القريب</th><th>ورد التخصيص</th><th>ورد التلاوة</th></tr>`;
 DAYS.forEach((d,i)=>{const x=new Date(b);x.setDate(b.getDate()+i);h+=`<tr><td class="dy">${d}<br><span class="v">${iso(x).slice(5)}</span></td><td>${esc(SCHED[i].t)}</td><td>${esc(SCHED[i].q)}</td><td>${esc(SCHED[i].k)}</td><td style="white-space:normal">${esc(SCHED[i].l)}</td></tr>`});
 return h+`</table></div><div class="sch-f">وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</div></div><div class="noprint"><button onclick="window.print()">📄 حفظ الجدول PDF</button></div>`}
async function saveSet(){
 const st=$("st").value;if(!st){alert("اختر تاريخ البداية");return}
 const arr=DAYS.map((d,i)=>{const o={};KEYS.forEach(k=>o[k]=norm($("sc_"+i+"_"+k).value));return o});
 const {error}=await sb.from("settings").upsert([{key:"start",value:st},{key:"schedule",value:arr}]);
 if(error){alert("تعذّر الحفظ، تأكد من تنفيذ كود SQL الجديد");return}
 START=st;SCHED=arr;alert("تم الحفظ ✅");render()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==TD&&page==="student")location.reload()});
init();
</script></body></html>
